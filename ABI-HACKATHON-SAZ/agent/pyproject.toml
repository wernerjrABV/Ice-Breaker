[project]
name = "workflow"
version = "0.1.0"
description = "workflow using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]==1.3.0",
    "fastapi[standard]>=0.139.2",
]

[dependency-groups]
dev = ["pytest>=8.4.0"]

[project.scripts]
kickoff = "workflow.main:kickoff"
crew = "workflow.main:kickoff"
api = "workflow.api:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/workflow"]

[tool.crewai]
type = "flow"
